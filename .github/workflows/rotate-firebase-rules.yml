name: Rotate Firebase rules

# Repousse d'un mois la borne temporelle des regles Realtime Database,
# les deploie sur Firebase, puis commite les nouvelles dates pour que le
# bandeau du dashboard affiche la bonne echeance.

on:
  schedule:
    - cron: "0 3 1 * *" # le 1er de chaque mois, 03:00 UTC
  workflow_dispatch: # bouton "Run workflow" pour declencher a la main

permissions:
  contents: write # autorise le GITHUB_TOKEN a pousser le commit

concurrency:
  group: rotate-firebase-rules
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalcule l'echeance
        id: rotate
        run: node scripts/rotate-rules.mjs

      - name: Ecrit la cle du compte de service
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Deploie les regles sur Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only database \
            --project platech-bdd \
            --non-interactive

      - name: Commite les nouvelles dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.rules.json src/utils/rulesDeadline.json
          if git diff --staged --quiet; then
            echo "Aucun changement a committer."
            exit 0
          fi
          git commit -m "chore: repousse l'echeance des regles firebase au ${{ steps.rotate.outputs.expires_on }}"
          git push
